# Local development database
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down
#   docker compose -f docker-compose.local.yml down -v   (видалити дані)
#
# Connection string for .env:
#   DATABASE_URL=postgresql://vegetables_user:vegetables_local_pass@localhost:5433/vegetables_db

services:
  postgres:
    container_name: vegetables-local-db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: vegetables_db
      POSTGRES_USER: vegetables_user
      POSTGRES_PASSWORD: vegetables_local_pass
    volumes:
      - vegetables_local_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vegetables_user -d vegetables_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vegetables_local_data:
